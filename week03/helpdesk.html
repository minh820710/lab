<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Demonstrates some basic HTML form elements" />
  <meta name="keywords" content="HTML, Form, tags" />
  <meta name="author" content="A Lecturer"  />
  <title>CWA Help Desk Appointment</title>
</head>
<body>
    <p>
        <a href="https://www.swin.edu.au">
            <img src="logo.png" alt="Swinburne University of Technology" width="200" height="100" />
        </a>
    </p>
<h1>CWA Help Desk Appointment</h1>

<p>The Help Desk is located in ATC620. Open 10:30 to 10:00 Monday to Friday.</p>
<p>Check Blackboard for when CWA tutors will be there.</p>


<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
    <fieldset>
        <legend>Student details</legend>
	<!--Note we have to use a special escape character to print an apostrophe on the Web page -->
	<p><label for="Student_ID">Student ID</label> 
		<input type="text" name= "Student_ID" id="Student_ID" required="required" pattern="[0-9]{7,10}"/>
	</p>
	<p><label for="Given_Name">Given Name</label> 
		<input type="text" name= "Given_Name" id="Given_Name" required="required" maxlength="10" size="15" pattern="[A-Za-z]+"/>
	
	<label for="Family_Name">Family Name</label> 
		<input type="text" name= "Family_Name" id="Family_Name" required="required" maxlength="10" size="15" pattern="[A-Za-z]+"/>
	</p>
</fieldset>
<fieldset>
        <legend>Your unit</legend>
    <p>
        <input type="radio" name = "Unit" id="COS10011" value="COS10011" required="required"/>
        <label for="COS10011">COS10011</label>

        <input type="radio" name = "Unit" id="COS60004" value="COS60004"/>
        <label for="COS60004">COS60004</label>

        <input type="radio" name = "Unit" id="COS60007" value="COS60007"/>
        <label for="COS60007">COS60007</label>
    </p>
    <p>
        <label for="Your_tutor">Your tutor</label>
        <select name="tutor" id="Your_tutor">
            <option value="">Please Select</option>
            <option value="Tutor1">Tutor 1</option>
            <option value="Tutor2">Tutor 2</option>
            <option value="Tutor3">Tutor 3</option>
        </select>
    </p>
    </fieldset>

	<fieldset>
		<legend>Issue</legend>
    <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked"/>

        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="CSS" />

        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="javascript" name="issue[]" value="JavaScript" />

        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="PHP" />
        
        <label for="mysql">MySQL</label>    
        <input type="checkbox" id="mysql" name="issue[]" value="MySQL" />
    </p>

    <p>
        <label for="issue_desc">Description of Issue</label>
        <textarea name="issue_desc" id="issue_desc" rows="5" cols="40" placeholder="Please describe your issue here"></textarea>
    </p>
    </fieldset>
    <fieldset>
        <legend>Preferred Date / Time</legend>
        <p>
            <label for="date">Date</label>
            <input type="text" name="date" placeholder="dd/mm/yyyy" id="date" pattern="\d{2}/\d{2}/\d{4}" title="Please enter a date in the format dd/mm/yyyy" required="required"/>
        </p>
    
    <p>
        <label for="time">Time</label>
        <input type="text" id="time" name="time" placeholder="00:00" pattern="\d{2}:\d{2}" title="Please enter a time in the format HH:MM" required="required"/>
    </p>
    </fieldset>
	<input type= "submit" value="Book"/>
	<input type= "reset" value="Reset Form"/>
</form>
</body>
</html>
